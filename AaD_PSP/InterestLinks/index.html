<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClassHub - Recursos</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    
    <style>
        /* ESTILO MINIMALISTA "HACKER / TERMINAL" */
        :root {
            --bg-color: #0d1117;
            --text-color: #c9d1d9;
            --accent-color: #58a6ff; /* Azul terminal */
            --border-color: #30363d;
            --success-color: #238636;
        }

        body {
            font-family: 'Courier New', Courier, monospace; /* Fuente monoespaciada */
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 { border-bottom: 2px solid var(--border-color); padding-bottom: 10px; color: var(--accent-color); }

        /* Formulario */
        .input-group {
            background: #161b22;
            padding: 15px;
            border: 1px solid var(--border-color);
            margin-bottom: 30px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        input, select {
            background: #0d1117;
            border: 1px solid var(--border-color);
            color: white;
            padding: 8px;
            font-family: inherit;
            flex-grow: 1;
        }

        button {
            background: var(--success-color);
            color: white;
            border: none;
            padding: 8px 16px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
        }

        button:hover { opacity: 0.9; }

        /* Lista de Links */
        #link-list { list-style: none; padding: 0; }

        .link-item {
            padding: 15px 0;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: baseline;
        }

        .link-number { color: #8b949e; margin-right: 10px; min-width: 20px;}
        
        .link-title {
            color: var(--text-color);
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1em;
            margin-right: 10px;
        }
        
        .link-title:hover { color: var(--accent-color); text-decoration: underline; }

        .link-meta {
            font-size: 0.85em;
            color: #8b949e;
        }

        .tag {
            font-size: 0.75em;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            margin-left: 8px;
        }

        .tag-react { color: #61dafb; border-color: #61dafb; }
        .tag-noticias { color: #f1e05a; border-color: #f1e05a; }
        .tag-empleo { color: #ff7b72; border-color: #ff7b72; }
        .tag-otros { color: #d2a8ff; border-color: #d2a8ff; }

    </style>
</head>
<body>

<div class="container">
    <h1>> ClassHub_ v1.0</h1>
    <p>Compartir recursos de forma rápida y descentralizada.</p>

    <div class="input-group">
        <input type="text" id="titleInput" placeholder="Título del recurso..." required>
        <input type="url" id="urlInput" placeholder="https://..." required>
        <select id="categoryInput">
            <option value="Noticias">Noticias</option>
            <option value="React">React</option>
            <option value="Empleo">Empleo</option>
            <option value="Otros">Otros</option>
        </select>
        <button onclick="addLink()">[ + PUBLICAR ]</button>
    </div>

    <div id="loading">Cargando datos...</div>
    <ul id="link-list"></ul>
</div>

<script>
    // ---------------- CONFIGURACIÓN ----------------
    // Pega aquí tus credenciales de Supabase
    const SUPABASE_URL = 'https://slouzjlweszhmyndxoyv.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNsb3V6amx3ZXN6aG15bmR4b3l2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg3ODc5MTIsImV4cCI6MjA4NDM2MzkxMn0.UEIOrSzrWLeOZY3gBUKm6fwyBtwPb3hYWhPtiftCwts';

    // Inicializamos el cliente
    const { createClient } = supabase;
    const _supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    // ---------------- FUNCIONES ----------------

    // 1. Cargar links al iniciar
    async function fetchLinks() {
        const { data, error } = await _supabase
            .from('links')
            .select('*')
            .order('created_at', { ascending: false }); // Los más nuevos primero

        const listElement = document.getElementById('link-list');
        const loadingElement = document.getElementById('loading');
        
        if (error) {
            console.error(error);
            loadingElement.innerText = "Error cargando datos. Revisa la consola.";
            return;
        }

        loadingElement.style.display = 'none';
        listElement.innerHTML = ''; // Limpiar lista

        // Generar HTML por cada link
        data.forEach((link, index) => {
            const li = document.createElement('li');
            li.className = 'link-item';
            
            // Asignar color a la etiqueta
            let tagClass = 'tag-otros';
            if(link.category) tagClass = `tag-${link.category.toLowerCase()}`;

            // Extraer dominio para mostrarlo bonito (ej: github.com)
            let domain = '';
            try { domain = new URL(link.url).hostname; } catch(e){}

            li.innerHTML = `
                <span class="link-number">${index + 1}.</span>
                <div>
                    <a href="${link.url}" target="_blank" class="link-title">${link.title}</a>
                    <span class="link-meta">(${domain})</span>
                    <span class="tag ${tagClass}">#${link.category}</span>
                </div>
            `;
            listElement.appendChild(li);
        });
    }

    // 2. Añadir nuevo link
    async function addLink() {
        const title = document.getElementById('titleInput').value;
        const url = document.getElementById('urlInput').value;
        const category = document.getElementById('categoryInput').value;
        const btn = document.querySelector('button');

        if (!title || !url) {
            alert("Por favor, rellena título y URL");
            return;
        }

        btn.innerText = "Guardando...";
        btn.disabled = true;

        const { error } = await _supabase
            .from('links')
            .insert([{ title: title, url: url, category: category }]);

        if (error) {
            alert("Error al guardar: " + error.message);
            console.error(error);
        } else {
            // Limpiar inputs y recargar
            document.getElementById('titleInput').value = '';
            document.getElementById('urlInput').value = '';
            fetchLinks(); // Recargar la lista
        }

        btn.innerText = "[ + PUBLICAR ]";
        btn.disabled = false;
    }

    // Iniciar carga
    fetchLinks();

</script>

</body>
</html>
