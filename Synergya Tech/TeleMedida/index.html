<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Medición</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    
    <div id="container">
        <img src="sources/logoSyngergya.png" alt="">
        <h2>FORMULARIO</h2>

        <form id="formulario">
            <label for="punto">1- CONTADOR Nº:</label>
            <input type="number" id="punto" inputmode="integer" required placeholder="Introducir Nº Contador" min="1" max="80">
            
            

            <label for="totalizado">2- TOTALIZADOR (m³):</label>
            <input type="number" step="0.01" id="totalizado" inputmode="decimal" required placeholder="Introducir Totalizador" min="0">

            <label for="foto">3- FOTO TOTALIZADOR:</label>
            <div class="file-input-wrapper">
                <input type="file" id="foto" accept="image/*" required>
            </div>
            
            <div class="buttons">
                <button type="reset" class="reset">REINICIAR</button>
                <button type="submit" class="submit">ENVIAR</button>
            </div>
        </form>
    </div>

    <script src="js/app.js" defer></script>
</body>
</html>
