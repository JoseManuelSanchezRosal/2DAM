<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script defer>
        
        function sumar(){
            const $num1 = parseInt(document.getElementById("num1").value)
            const $num2 = parseInt(document.getElementById("num2").value)
            alert ($num1 + $num2)
        }
    </script>

</head>
<body>
    <h3>Crear una web que tenga dos cuadros de texto y un botón y hacer un script de javaScript para que cuando hagamos click sobre él se muestre con la función alert la suma de lo escrito en ambos cuadros de texto.</h3>

    <input type="number" name="" id="num1">
    <input type="number" name="" id="num2">
    <button onclick="sumar()" >Sumar</button>
</body>
</html>
