<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <script>
        const alumno = {
            nombre: "Jose Manuel",
            din: 9,
            aad: 10,
            opt: 9,
            ipe: 10,
            ingles: 10,

            salidaNombre: function(){
                return this.nombre
            },
            salidaCalificaciones: function(){
                return this.din +", "+this.aad+", "+this.opt+", "+this.ipe+", "+this.ingles
            },
            salidaMedia: function(){
                return ((this.din +this.aad+this.opt+this.ipe+this.ingles)/5)
            }
        }
        function nombre(){
            document.getElementById("labelNombre").textContent = alumno.salidaNombre()
        }

        function calificaciones(){
            document.getElementById("labelCalificaciones").textContent = alumno.salidaCalificaciones()
        }

        function media(){
            document.getElementById("labelMedia").textContent = alumno.salidaMedia()

        }
    </script>

</head>
<body>

    <h3>Define un objeto que sea un alumno para guardar sus calificaciones, los módulos que tienen que tener son DIN, AaD, Opt, IPE e Inglés, en la salida tenemos que devolver el nombre del alumno, las diferentes calificaciones y la media.</h3>

    <button onclick="nombre()" >Devolver nombre</button> <label id="labelNombre"></label><br><br>
    <button onclick="calificaciones()" >Devolver calificaciones</button> <label id="labelCalificaciones"></label><br><br>
    <button onclick="media()" >Devolver media</button> <label id="labelMedia"></label><br><br>

    
</body>
</html>
