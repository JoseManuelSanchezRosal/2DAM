<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script>
        function crearTabla(){
            const $filas = parseInt(document.getElementById("filas").value)
            const $columnas = parseInt(document.getElementById("columnas").value)
            const $divSalida = document.getElementById("salida")
            $divSalida.innerHTML = ""

            const tabla = document.createElement("table")
            tabla.style.borderCollapse = "collapse"
            for (let i = 0; i < $filas; i++){
                const fila = document.createElement("tr")
                for (let j = 0; j < $columnas; j++){
                    const celda = document.createElement("td")
                    celda.style.backgroundColor = (j % 2 === 0) ? "yellow" : "brown"
                    celda.style.height = "20px"
                    celda.style.width = "50px"
                    celda.style.border = "1px solid black"

                    fila.appendChild(celda)
                }
                tabla.appendChild(fila)
            }
            $divSalida.appendChild(tabla)
        }
    </script>

</head>
<body>
    <h3>Basándose en el script anterior hacer las modificaciones oportunas para que ahora las columnas pares e impares sean diferentes.</h3>
    <input type="number" id="filas" placeholder="Introduzca filas">
    <input type="number" id="columnas" placeholder="Introduzca columnas">
    <button onclick="crearTabla()">Crear Tabla</button>

    <div id="salida"></div>

</body>
</html>
