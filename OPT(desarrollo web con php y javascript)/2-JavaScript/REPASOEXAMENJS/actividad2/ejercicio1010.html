<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script>
        function generarTabla(){
            const $salida = document.getElementById("salida")
            const $nFilas = parseInt(document.getElementById("filas").value)
            const $nColumnas = parseInt(document.getElementById("columnas").value)
            const $tabla = document.createElement("table")
            $tabla.style.border = "1px solid black"
            $tabla.style.borderCollapse = "collapse"
            $salida.innerHTML = ""

            for (let i = 0; i < $nFilas; i++){
                let fila = document.createElement("tr")
                
                

                for (let j = 0; j < $nColumnas; j++){
                    let celda = document.createElement("td")
                    celda.style.border = "1px solid black"
                    celda.style.width = "50px"
                    celda.style.height = "20px"
                    if(j % 2 == 0){
                        celda.style.backgroundColor = "red"
                }
                    fila.appendChild(celda)
                }
                $tabla.appendChild(fila)
            }
            $salida.appendChild($tabla)
                

            
        }
    </script>
   


</head>
<body>
    <h3>Crear un script que pida al usuario mediante dos cuadros de texto un número de filas y columnas y dibuje una tabla html con dicho número de filas y columnas. Además las filas pares e impares serán de diferente color.</h3>
    <input type="number" id="filas" placeholder="introduzca FILAS">
    <input type="number" id="columnas" placeholder="introduzca COLUMNAS">
    <button onclick="generarTabla()">Pulse para generar Tabla</button>
    <div id="salida"></div>
    
    
</body>
</html>
