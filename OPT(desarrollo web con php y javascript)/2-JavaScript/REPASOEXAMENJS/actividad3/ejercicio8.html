<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .banner{
            width: 80%;
            margin-left: 10%;
            margin-right: 10%;
        }
        .banner img{
            width: 100%;
            height: 250px;
            overflow: hidden;
            point
        }
    </style>

    <script>
        const imagenes = [
            "sources/banner1.jpeg",
            "sources/banner2.jpeg",
            "sources/banner3.jpeg",
            "sources/banner4.jpeg"
        ];

        let indice = 0

        function cambiarImagen(){
            indice = (indice + 1) % imagenes.length // Pasar al siguiente indice sin sobrepasar el tamano
            document.getElementById("banner-img").src = imagenes[indice]
        }
        setInterval(cambiarImagen, 3000)
    </script>

</head>
<body>
    <h3>Implementar una web que tenga un banner que ocupe todo el ancho de la pantalla salvo un margen del 10% en cada lado. Dicho banner irá intercambiando entre cuatro imágenes cuyas rutas estarán almacenadas en un array. El intercambio se hará secuencialmente cada 3 segundos.</h3>
    <div class="banner">
        <img id="banner-img">
    </div>
</body>
</html>
