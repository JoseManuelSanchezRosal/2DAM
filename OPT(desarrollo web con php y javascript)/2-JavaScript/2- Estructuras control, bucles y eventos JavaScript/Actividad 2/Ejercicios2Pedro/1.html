<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function esNum(){
            let cadena=document.getElementById("cuadro").value;
            if(isNaN(cadena)){ // /^[0-9]*$/.test(cadena)
                document.getElementById("cuadro").value="";
            }
        }
    </script>
</head>
<body>
    <h2>Crear una web con un cuadro de texto en los que cuando el usuario introduzca algo que no sea un dígito numérico se borre todo el contenido de dicho cuadro.</h2>
    <input type="text" id="cuadro" onkeyup="esNum()">
</body>
</html>
