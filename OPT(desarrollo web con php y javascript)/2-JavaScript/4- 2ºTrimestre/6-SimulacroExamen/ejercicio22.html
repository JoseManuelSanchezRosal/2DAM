<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>                             <h2>Cargar XML y filtrar por boton</h2>

    <button onclick="filtroCategoria('Lácteos')">Lacteos</button>
    <button onclick="filtroCategoria('Panadería')">Panadería</button>
    <button onclick="filtroCategoria('Higiene')">Higiene</button>

    <div id="demo"></div>

    <script>

        let productos                                                  // Declaramos variable global donde almacenaremos los productos

        async function cargarXML(prod) {                               // Funcion asincrona para cargar la ruta del XML
            let fichero = await fetch(prod)                            // 1 Await a la ruta
            let ficheroTexto = await fichero.text()                    // 2 Await al texto de la ruta
            let parser = new DOMParser()                               // 3 Instancia DomParser
            let nodoProductos = parser.parseFromString(ficheroTexto, "text/xml") // 4 Parseamos a nodosXML

            productos = nodoProductos.getElementsByTagName("producto") // 5 Almacenamos los nodos de los productos
        }

        function filtroCategoria(filtro){                              
            let contenedor = document.getElementById("demo")           // 6 Declaramos contenedor del DOM donde se incluira la INFO
            contenedor.innerHTML = ""                                  // 7 Lo limpiamos por si había filtros anteriores

            let lista = document.createElement("ol")                   // 8 Creamos la lista donde apendaremos la info

            for(let i = 0; i < productos.length; i++){                 // 9 Recorremos todos los productos
                if(productos[i].getElementsByTagName("categoria")[0].textContent == filtro){ // 10 Nos quedamos con los que coincidan con el filtro
                    let fila = document.createElement("li")            // 11 Creamos fila
                    let texto = document.createElement("span")         // 12 Creamos span para el texto

                                                                       // 13 Asignamos la info al span (nombre, categoria y precio)
                    texto.textContent = productos[i].getElementsByTagName("nombre")[0].textContent + " " + productos[i].getElementsByTagName("categoria")[0].textContent + " " + productos[i].getElementsByTagName("precio")[0].textContent

                    fila.appendChild(texto)                            // 14 Apendamos span a fila
                    lista.appendChild(fila)                            // 15 Apendamos fila a lista
                }
            }
            contenedor.appendChild(lista)                              // 16 Apendamos lista a contenedor fuera FOR
        }
        cargarXML("productos.xml")

    </script>

    
</body>
</html>
