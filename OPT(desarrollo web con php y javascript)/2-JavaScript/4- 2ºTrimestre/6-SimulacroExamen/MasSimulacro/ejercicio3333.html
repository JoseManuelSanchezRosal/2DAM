<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Cargar JSON y pais coches</h2>
    <button onclick="filtro('Japón')">Japón</button>
    <button onclick="filtro('Alemania')">Alemania</button>
    <button onclick="filtro('Italia')">Italia</button>
    <button onclick="filtro('Francia')">Francia</button>
    <div id="demo"></div>

    <script>
        let coches
        async function cargarJSON(rutaJSON) {
            let fichero = await fetch(rutaJSON)
            let textoFichero = await fichero.text()
            coches = JSON.parse(textoFichero)
        }

        function filtro(pais){
            let contenedor = document.getElementById("demo")
            contenedor.innerHTML = ""
            let lista = document.createElement("ol")
            for(let i = 0; i < coches.length; i++){
                if(coches[i].lugar_origen == pais){
                    let fila = document.createElement("li")
                    let texto = document.createElement("span")
                    texto.textContent = coches[i].marca + " " + coches[i].anio_fundacion + " " + coches[i].lugar_origen

                    fila.appendChild(texto)
                    lista.appendChild(fila)
                }
            }
            contenedor.appendChild(lista)
        }
        cargarJSON("coche.json")
    </script>
    
</body>
</html>
