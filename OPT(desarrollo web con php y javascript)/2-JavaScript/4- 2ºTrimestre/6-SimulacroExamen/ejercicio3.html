<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Ejercicio 3</h2>
    <button onclick="filtrado('Alemania')">Alemania</button>
    <button onclick="filtrado('Japón')">Japón</button>
    <button onclick="filtrado('Italia')">Italia</button>

    <div id="demo"></div>
    
    <script>
        let coches
        async function cargarJson() {
            const respuesta = await fetch("coche.json")
            const datos = await respuesta.text()
            coches = JSON.parse(datos)
        }

        function filtrado(filtro){
            let contenedor = document.getElementById("demo")
            contenedor.innerHTML = ""
            let lista = document.createElement("ol")

            for(let i = 0; i < coches.length; i++){
                if(coches[i].lugar_origen == filtro){
                    let fila = document.createElement("li")
                    fila.textContent = coches[i].marca + " " + coches[i].anio_fundacion + " " + coches[i].lugar_origen
                    lista.appendChild(fila)
                }
            }
            contenedor.appendChild(lista)
        }

        
        cargarJson()
    </script>
</body>
</html>
