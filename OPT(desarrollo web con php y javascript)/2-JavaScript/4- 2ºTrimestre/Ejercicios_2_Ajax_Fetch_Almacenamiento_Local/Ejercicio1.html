<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h2>Cargar Archivo XML y sus Autores con Fetch</h2>
    <button onclick="cargarXml()">Cargar XML</button>
    <p id="demo"></p>

    <script>
        // NOTA: El XML debe estar en la raíz junto a este archivo, o usar una ruta absoluta.
        function cargarXml() {

            // 1. Inicia la petición al archivo XML.
            fetch("catalogo.xml")

                // 2. Extrae la respuesta como texto plano.
                .then(response => response.text())

                // 3. Procesa el texto extraído ('str').
                .then(str => {

                    // 4 y 5. Convierte el texto plano en un objeto XML navegable (DOM).
                    const parser = new DOMParser();
                    const xmlDoc = parser.parseFromString(str, "text/xml");

                    // 6. Obtiene una lista con todas las etiquetas <ARTIST>.
                    const x = xmlDoc.getElementsByTagName("ARTIST");

                    // Variable para almacenar el contenido final.
                    let txt = "";

                    // 7. Recorre la lista de artistas, extrae su texto y añade un salto de línea.
                    for (let i = 0; i < x.length; i++) {
                        txt += "El autor " + i + " es: " + x[i].childNodes[0].nodeValue + "<br>";
                    }

                    // 8. Inyecta el resultado acumulado en el párrafo con id "demo".
                    document.getElementById("demo").innerHTML = txt;
                })

                // 9. Captura cualquier error (ej. archivo no encontrado) y lo muestra en consola.
                .catch(error => console.error("Error en la petición:", error));
        }
    </script>

</body>

</html>
