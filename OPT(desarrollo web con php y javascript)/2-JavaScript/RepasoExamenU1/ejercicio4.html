<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <script>
        function sacarFactorial(){
            const entrada = document.getElementById("numero");
            const resultado = document.getElementById("resultado");

            let n = parseInt(entrada.value);

            if(isNaN(n) || n < 0){
                resultado.textContent = "Ingrese un numero entero positivo"
                return;
            }
            let factorial = 1;
            for (let i = 1; i <= n; i++){
                factorial *= i;
            }

            resultado.textContent = factorial;
        }

    </script>

</head>

<body>
    <h4>Crea un script que devuelva el numero factorial introducido por teclado</h4>
    <input type="number" id="numero" placeholder="Escriba un numero">
    <button onclick="sacarFactorial()">Calcular Factorial >></button>
    <label id="resultado"></label>
    
</body>
</html>
