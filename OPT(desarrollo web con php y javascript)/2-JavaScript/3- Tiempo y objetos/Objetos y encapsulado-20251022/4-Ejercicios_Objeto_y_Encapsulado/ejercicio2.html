<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio</title>

    <style>
        .inputNotas{
            width: 30px;
        }
    </style>

    <script>
        class Alumno{
            constructor(nombre, din, aad, opt, ipe, ingles) {

                this._nombre = nombre;
                this._din = din;
                this._aad = aad;
                this._opt = opt;
                this._ipe = ipe;
                this._ingles = ingles;
            }

            setNombre(nombre){
                this._nombre = nombre;
            }

            setCalificaciones(din, aad, opt, ipe, ingles) {
                this._din = din;
                this._aad = aad;
                this._opt = opt;
                this._ipe = ipe;
                this._ingles = ingles;
                }

            salidaNombre(){
                document.getElementById("labelNombre").textContent = this._nombre;
            }

            salidaCalificaciones(){
                document.getElementById("labelDin").textContent = this._din;
                document.getElementById("labelAad").textContent = this._aad;
                document.getElementById("labelOpt").textContent = this._opt;
                document.getElementById("labelIpe").textContent = this._ipe;
                document.getElementById("labelIngles").textContent = this._ingles;
            }

            calcularMedia(){
                const media = ((this._din + this._aad + this._opt + this._ipe + this._ingles)/5);
                return media;
            }

            salidaMedia(){
                document.getElementById("labelMedia").textContent = alumno.calcularMedia();
            }
        }
        let alumno = new Alumno();

        function mostrarNombre(){
            const nombre = document.getElementById("nombre").value;
            alumno.setNombre(nombre);
            alumno.salidaNombre();
        }

        function mostrarCalificaciones(){
            const din = parseFloat(document.getElementById("din").value);
            const aad = parseFloat(document.getElementById("aad").value);
            const opt = parseFloat(document.getElementById("opt").value);
            const ipe = parseFloat(document.getElementById("ipe").value);
            const ingles = parseFloat(document.getElementById("ingles").value);
            alumno.setCalificaciones(din, aad, opt, ipe, ingles);
            alumno.salidaCalificaciones();
        }

        function mostrarMedia(){
            const media = alumno.salidaMedia();
        }

    </script>

</head>

<body>
    <h3>Modifica el ejercicio anterior, una clase alumno para guardar sus calificaciones, los módulos que tienen que tener son DIN, AaD, Opt, IPE e Inglés, en la salida tenemos que devolver el nombre del alumno, las diferentes calificaciones y la media</h3>
    <br>

    <!--Para nombre ponemos TYPE TEXT, para calificaciones TYPE NUMBER-->
    <label>Inserte nombre</label>
    <input type="text" id="nombre">
    <br><br>
    <label>Inserte Calificaciones:</label>
    <label>DIN:</label> <input type="number" id="din" class="inputNotas">
    <label>AaD:</label> <input type="number" id="aad" class="inputNotas">
    <label>Opt:</label> <input type="number" id="opt" class="inputNotas">
    <label>IPE:</label> <input type="number" id="ipe" class="inputNotas">
    <label>Inglés:</label> <input type="number" id="ingles" class="inputNotas">
    <br><br><br>
    
    <button id="btnNombre" onclick="mostrarNombre()">Devolver nombre</button>
    <label id="labelNombre"></label><br><br>

    <button id="btnCalificaciones" onclick="mostrarCalificaciones()">Devolver calificaciones</button>
    <label>DIN:</label> <label id="labelDin"></label>
    <label>AaD:</label> <label id="labelAad"></label>
    <label>Opt:</label> <label id="labelOpt"></label>
    <label>IPE:</label> <label id="labelIpe"></label>
    <label>Inglés:</label> <label id="labelIngles"></label><br><br>

    <button id="btnMedia" onclick="mostrarMedia()">Devolver media calificaciones</button>
    <label id="labelMedia"></label>
    
</body>
</html>
