<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Ejercicio 5</title>
            <style>
                
                /* Contenedor donde se muestra el GIF o la tabla */
                #contenedor {
                position: relative;
                height: 250px;
                }

                /* GIF animado en posición absoluta para moverlo horizontalmente */
                #gif {
                position: absolute;
                max-width: 200px;
                }
                
                table, td {
                border: 1px solid black;
                border-collapse: collapse;
                }
            </style>
            
    </head>

    <body>
        <h3>Modificar el ejercicio anterior para que durante los 5 segundos que está el gif mostrándose se mueva de izquierda a derecha de la pantalla de 10 en 10 pixel en intervalos de tiempo de 100 milisegundos.</h3>

        <!-- Contenedor principal -->
        <div id="contenedor">
            <img id="gif" src="sources/homer.gif" alt="GIF animado">
        </div>
    </body>
    <script>
        // Referencias a elementos
        const gif = document.getElementById("gif");
        const contenedor = document.getElementById("contenedor");

        // Variables de movimiento
        let posicionX = 0;           // Posición horizontal inicial del GIF
        const paso = 10;             // Cada 100ms se mueve 10px
        const intervaloTiempo = 100; // Intervalo de movimiento en ms
        const duracionGif = 5000;    // Duración total del GIF en ms (5s)

        // === Movimiento del GIF ===
        const intervaloMovimiento = setInterval(function() {
            posicionX += paso;        // Avanza 10px
            gif.style.left = posicionX + "px";
        }, intervaloTiempo);


        // === Cambio a tabla después de 5 segundos ===
        setTimeout(function() {
            clearInterval(intervaloMovimiento); // Detiene el movimiento
            contenedor.innerHTML = "";          // Borra el GIF

            // Crear tabla 5x5 de forma dinámica
            const tabla = document.createElement("table");

            for (let fila = 0; fila < 5; fila++) {
                const tr = document.createElement("tr");

                for (let col = 0; col < 5; col++) {
                    const td = document.createElement("td");

                    // Mostrar la posición de cada celda
                    td.textContent = "F " + (fila + 1) + ", C " + (col + 1);
                    tr.appendChild(td);
                }

                tabla.appendChild(tr);
            }
            // Insertar la tabla en el contenedor
            contenedor.appendChild(tabla);
        }, duracionGif);

    </script>
    
</html>
