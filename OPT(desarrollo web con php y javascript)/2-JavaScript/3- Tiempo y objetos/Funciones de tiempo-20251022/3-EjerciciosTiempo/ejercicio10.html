<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Ejercicio 10</title>
        <style>

            body{
                display: flex;
                flex-direction: column;
                width: 90vw;
            }
            
            #caja{
                align-items: center;
                justify-content: center;
                align-self: center;
                width: 110px;
                display: flex;
                flex-direction: column;
                height: 80vh;
                background-color: black;
            }

            #semaforo{
                width: 400px;
                background-color: black;
                padding: 20px;
                border-radius: 20px;
            }

            .luz{
                width: 80px;
                height: 400px;
                border-radius: 50%;
                background-color: grey;
                margin: 15px;
            }

        </style>

        <script>
            let luces;     // guardará las tres luces (divs)
            let indice = 0; // indica qué luz está encendida

            function cambiarLuz() {
                // Apagar todas las luces
        
                for (let i = 0; i < luces.length; i++) {
                    luces[i].style.backgroundColor = "grey";
        
                }

                // Encender la luz correspondiente según el índice
                if (indice === 0) {
                    luces[2].style.backgroundColor = "green"; //Si indice 0, encendemos la verde
                } else if (indice === 1) {
                    luces[1].style.backgroundColor = "yellow"; //Si indice 1. encendemos la amarilla
                } else if (indice === 2) {
                    luces[0].style.backgroundColor = "red"; //Si indice 2, encendemos la roja
                }

                // Pasar a la siguiente luz
                indice++;
                if (indice > 2) {
                    indice = 0; // vuelve a la primera
                }
            }
            
            function iniciarSemaforo() {
                luces = document.getElementsByClassName("luz");
                cambiarLuz(); // encender la primera
                setInterval(cambiarLuz, 3000); // cambiar cada 3 segundos
            }
        </script>
    
    </head>

    <body onload="iniciarSemaforo()">

        <h3>Implementar el funcionamiento de un semáforo en javascript mediante las funciones de tiempo. Podéis utilizar tres imágenes que se vayan intercambiando secuencialmente.</h3>

        <div id="caja">
            <div class="luz" id="rojo"></div>
            <div class="luz" id="amarillo"></div>
            <div class="luz" id="verde"></div>
        </div>
        
    </body>
</html>
