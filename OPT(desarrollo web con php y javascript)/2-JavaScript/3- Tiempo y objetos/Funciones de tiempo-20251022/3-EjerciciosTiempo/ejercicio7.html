<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Cronómetro con historial</title>
        <script>
            let segundos = 0;       // Contador de segundos
            let intervalo = null;   // Variable que guarda la referencia del setInterval

            // FUNCION PARA CONTAR SEGUNDO A SEGUNDO
            function contar() {
                segundos++; // contamos cada segundo
                document.getElementById("display").textContent = segundos; // mostramos en pantalla
            }

            // FUNCION PARA INICIAR EL INTERVALO DE TIEMPO (CONTAR) SI NO HAY NINGUNO ACTIVO
            function iniciar() {
                if (!intervalo) { // Evita múltiples intervalos activos
                    intervalo = setInterval(contar, 1000);
                }
            }

            // FUNCION PARA PARAR EL CONTADOR Y GUARDAR EL TIEMPO
            function parar() {
                if (intervalo) {
                    clearInterval(intervalo);  // Detiene el intervalo
                    intervalo = null;          // Permite reiniciar luego
                    guardarTiempo();           // Guarda el tiempo actual
                }
            }

            // FUNCION PARA GUARDAR EL TIEMPO ACTUAL EN UN DIV CADA VEZ QUE PULSAMOS PARADA
            function guardarTiempo() {
                const historial = document.getElementById("historial"); //Cogemos la info del historial de paradas
                const nuevoTiempo = document.createElement("p"); // creamos un nuevo parrafo
                nuevoTiempo.textContent = segundos + ' segundos'; // asignamos al nuevo parrafo el contador actual
                historial.appendChild(nuevoTiempo); // y lo apendamos al DIV
            }

            // FUNCION PARA PARAR Y REESTABLECER EL CONTADOR A 0
            function resetear() {
                clearInterval(intervalo); // Paramos el intervalo de contador
                intervalo = null;
                segundos = 0;
                document.getElementById("display").textContent = segundos;
            }
        </script>
    </head>

    <body>
        <h3>Modificar el ejercicio anterior para que cada vez que se pare el cronómetro se vayan guardando en un div los tiempos de parada.</h3>

        <button id="iniciar" onclick="iniciar()">Iniciar/Reanudar</button>
        <button id="parar" onclick="parar()">Parar</button>
        <button id="reset" onclick="resetear()">Reset</button>

        <span id="display">0</span> <span>Segundos</span>
        <br>

        <!--Div donde almacenaremos el tiempo de cada parada de nuestro crono-->
        <div id="historial">
            <h4>Historial de paradas:</h4>
        </div>
    </body>

</html>
