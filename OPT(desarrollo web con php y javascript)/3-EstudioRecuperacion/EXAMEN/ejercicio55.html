<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <textarea onmouseover="mouseOver(this)" onmouseleave="mouseLeave(this)" onfocus="onFocus(this)" onblur="onBlur(this)">HOLA GAYER</textarea>
    <textarea onmouseover="mouseOver(this)" onmouseleave="mouseLeave(this)" onfocus="onFocus(this)" onblur="onBlur(this)">HOLA GAYER 2</textarea>
    <textarea onmouseover="mouseOver(this)" onmouseleave="mouseLeave(this)" onfocus="onFocus(this)" onblur="onBlur(this)">HOLA GAYER 3</textarea>
    
    <script>
        function mouseOver(elemento){
            elemento.style.fontSize = "20px"
            elemento.style.color = "red"
        }

        function mouseLeave(elemento){
            elemento.style.fontSize = ""
            elemento.style.color = ""
        }
        function onFocus(elemento){
            elemento.style.backgroundColor = "blue" 
        }
        function onBlur(elemento){
            elemento.style.backgroundColor = "white" 
        }
    </script>
</body>
</html>
