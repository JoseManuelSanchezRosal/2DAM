<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--Input cantidad-->
    <input id="cantidad" placeholder="introduzca cantidad">

    <!--Select moneda entrada-->
    <select id="monedaEntrada">
        <option value="euro">euros</option>
        <option value="dolar">dolares</option>
        <option value="libra">libras</option>
    </select>

    <!--Span para mostrar la conversion-->
    <span> son: </span> <label id="salida"></label>

    <!--Select de salida-->
    <select id="monedaSalida">
        <option value="euro">euros</option>
        <option value="dolar">dolares</option>
        <option value="libra">libras</option>
    </select>

    <!--Boton de cambio de moneda-->
    <button onclick="cambiar()">CAMBIAR</button>

    <script>
        // Funcion para cambiar moneda
        function cambiar(){
            // 1 Capturamos elementos del DOM
            const $monedaEntrada = document.getElementById("monedaEntrada").value
            const $monedaSalida = document.getElementById("monedaSalida").value
            const $cantidad = document.getElementById("cantidad").value
            const $salida = document.getElementById("salida")


            // Parseamos para despues aplicar la tasa de cambio
            const valorMonedaEntrada = parseInt($cantidad)
            
            // Para euros a --
            if($monedaEntrada === "euro"){
                if($monedaSalida === "euro"){
                    $salida.textContent = valorMonedaEntrada

                    }else if($monedaSalida === "dolar"){
                        $salida.textContent = (valorMonedaEntrada * 1.164).toFixed(2)

                    }else if($monedaSalida === "libra"){
                        $salida.textContent = (valorMonedaEntrada * 0.873).toFixed(2)
                
                    }
                }

                // Para dolares a--
                if($monedaEntrada === "dolar"){
                    if($monedaSalida === "euro"){
                        $salida.textContent = (valorMonedaEntrada * 0.86).toFixed(2)

                    }else if($monedaSalida === "dolar"){
                        $salida.textContent = valorMonedaEntrada

                    }else if($monedaSalida === "libra"){
                        $salida.textContent = (valorMonedaEntrada * 0.75).toFixed(2)
                    }
                }

                // Para libras a--
                if($monedaEntrada === "libra"){
                    if($monedaSalida === "euro"){
                        $salida.textContent = (valorMonedaEntrada * 1.15).toFixed(2)

                    }else if($monedaSalida === "dolar"){
                        $salida.textContent = (valorMonedaEntrada * 1.33).toFixed(2)

                    }else if($monedaSalida === "libra"){
                        $salida.textContent = valorMonedaEntrada
                    }
                }
            }
            
    </script>
</body>
</html>
