<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>Hacer calculadora con 3 inputs, 2 para los numeros y uno para la operacion de +, -, *, /</h3>

    <input id="num1" placeholder="introduzca numero A">
    <input id="num2" placeholder="introduzca numero B">
    <input id="operando" placeholder="introduzca operando + - * /">
    <button onclick="realizarOperacion()">Calcular</button>
    <p id="salida"></p>
    

    <script>
        function realizarOperacion(){
            // 1 Capturamos los inputs
            const num1 = parseFloat(document.getElementById("num1").value)
            const num2 = parseFloat(document.getElementById("num2").value)
            const $operando = document.getElementById("operando").value
            const $salida = document.getElementById("salida")

            // 2 Realizamos operacion
            switch($operando){
                case "+":
                    $salida.textContent = num1 + num2
                    break
                    
                case "-":
                    $salida.textContent = num1 - num2
                    break

                case "*":
                    $salida.textContent = num1 * num2
                    break

                case "/":
                    $salida.textContent = num1 / num2
                    break

                default:
                    $salida.textContent = "Ingrese operando valido"

            }
        }
    </script>
</body>
</html>
